<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 140" width="440" height="140" role="img" aria-label="VitalFlow">
  <defs>
    <linearGradient id="vf-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
  </defs>

  <!-- mark -->
  <rect x="10" y="20" width="100" height="100" rx="28" fill="url(#vf-grad)"/>
  <!-- cash-flow pulse forming a V -->
  <path d="M30 62 H44 L54 44 L66 92 L76 68 H90"
        fill="none" stroke="#FFFFFF" stroke-width="8"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- wordmark -->
  <text x="132" y="80"
        font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="46" font-weight="700" letter-spacing="-1.2" fill="#0F172A">Vital<tspan fill="#0F766E">Flow</tspan></text>
  <text x="134" y="106"
        font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="13.5" font-weight="500" letter-spacing="1.4" fill="#64748B">FINANCIAL INTELLIGENCE</text>
</svg>
