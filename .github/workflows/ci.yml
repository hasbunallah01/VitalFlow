name: CI

# Triggers: every push to main, every PR targeting main.
# We intentionally keep the trigger list minimal. Adding a workflow_dispatch
# or schedule trigger would create additional failure emails for no reason.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Note: this file was previously more complex (a concurrency block + a
# conditional `app` job gated on package-lock.json). The complex version
# produced a "No jobs were run" error on every push — the run never even
# started. We've simplified it to just the docs-existence check. The
# `app` job (lint / typecheck / test / build) will be added back once the
# Next.js app exists in app/.

jobs:
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required documents exist
        run: |
          set -e
          for f in README.md LICENSE CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md \
                   docs/ARCHITECTURE.md docs/AGENTS.md docs/API_PLAN.md docs/ROADMAP.md \
                   docs/DATA_MODEL.md docs/SCORING_METHODOLOGY.md docs/SECURITY_PRIVACY.md; do
            test -f "$f" || { echo "::error::Missing required document: $f"; exit 1; }
          done
          echo "All required documents present."

      - name: Guard against committed secrets
        run: |
          if git ls-files | grep -E '^\.env($|\.local)' ; then
            echo "::error::An environment file is tracked. Remove it and rotate the credentials."
            exit 1
          fi
          echo "No environment files tracked."
