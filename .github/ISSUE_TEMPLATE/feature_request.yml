name: Feature request
description: Propose a capability
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the user's situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
    validations:
      required: true
  - type: dropdown
    id: phase
    attributes:
      label: Which roadmap phase does this belong to?
      options:
        - Phase 1 — MVP
        - Phase 2 — Depth
        - Phase 3 — Credit layer
        - Phase 4 — Connected data
        - Phase 5 — Always-on
        - Unsure
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
