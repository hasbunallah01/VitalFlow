services:
  db:
    image: postgres:16-alpine
    container_name: vitalflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vitalflow
      POSTGRES_PASSWORD: vitalflow
      POSTGRES_DB: vitalflow
    ports:
      - '5432:5432'
    volumes:
      - vitalflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vitalflow']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  vitalflow-db-data:
